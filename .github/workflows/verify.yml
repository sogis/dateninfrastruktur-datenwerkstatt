name: Verify Datenwerkstatt
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm install --global npm@11.18.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm install --global npm@11.18.0
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run assets:prepare
        id: assets
      - name: Engine and persistence integration
        run: xvfb-run -a npx playwright test tests/integration --project=${{ matrix.browser }} --output=test-results/integration
        env:
          DW_VIRTUAL_DISPLAY: '1'
          PLAYWRIGHT_HTML_REPORT: playwright-report/integration
      - name: Browser workflows
        if: "!cancelled() && steps.assets.outcome == 'success'"
        run: xvfb-run -a npx playwright test tests/e2e --project=${{ matrix.browser }} --output=test-results/e2e
        env:
          DW_VIRTUAL_DISPLAY: '1'
          PLAYWRIGHT_HTML_REPORT: playwright-report/e2e
      - run: npm run test:resources -- --output=test-results/resources
        if: matrix.browser == 'chromium'
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report/resources
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
            docs/verification/
  deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm install --global npm@11.18.0
      - run: npm ci
      - run: npm run assets:prepare
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: xvfb-run -a npm run test:deployment -- --project=${{ matrix.browser }}-0 --project=${{ matrix.browser }}-1 --project=${{ matrix.browser }}-2
        env:
          DW_VIRTUAL_DISPLAY: '1'
      - run: docker build -f deploy/Dockerfile -t datenwerkstatt:verified .
        if: matrix.browser == 'chromium'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-deployment-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results-deployment/
            docs/verification/
